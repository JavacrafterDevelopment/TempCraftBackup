# Publishes a release whenever a version tag is pushed:
#
#   1. bump version.txt (e.g. 0.1.1) and commit
#   2. tag v0.1.1 and push the commit and the tag
#
# Builds TempCraftBackup.exe with Windows' own C# compiler, packages it with a
# manifest of SHA-256 hashes, attaches the package to the GitHub release, and
# updates update.json on the `updates` branch, which is where the Launcher looks
# for new versions.

name: Release

on:
  push:
    tags: ['v*']

# One release at a time, so two tags pushed together can't race on update.json.
concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches version.txt
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $ver = (Get-Content version.txt -Raw).Trim()
          if ($tag -ne $ver) { throw "Tag v$tag doesn't match version.txt ($ver)" }

      - name: Build and package
        shell: pwsh
        run: ./build.ps1 -Out dist

      # TempCraftBackup-windows-x64.zip is what the Launcher installs and updates from:
      # every file in the folder, listed with its SHA-256 in launcher-manifest.json.
      # TempCraftBackup.exe is attached too, for running it on its own.
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $pre = if ($tag -match '-') { '--prerelease' } else { $null }
          gh release create $tag dist/TempCraftBackup-windows-x64.zip dist/TempCraftBackup/TempCraftBackup.exe `
            --title "TempCraftBackup $($tag.TrimStart('v'))" --generate-notes $pre

      # update.json is what the Launcher checks first: served from
      # raw.githubusercontent.com, so it isn't subject to the GitHub API's 60-an-hour
      # limit. It lives on its own `updates` branch so releases never add commits to main.
      - name: Publish update.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag  = '${{ github.ref_name }}'
          $repo = '${{ github.repository }}'
          $info = gh release view $tag --json body,isPrerelease | ConvertFrom-Json
          # Read raw: ConvertFrom-Json would turn the timestamp into a local-format date.
          $published = gh release view $tag --json publishedAt --jq .publishedAt

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if (git ls-remote --heads origin updates) {
            git fetch --depth 1 origin updates
            git worktree add updates-branch FETCH_HEAD
          } else {
            # First release: start the branch with nothing else on it.
            git worktree add --detach updates-branch
            git -C updates-branch checkout --orphan updates
            git -C updates-branch rm -rf --quiet .
          }

          ./tools/publish-update.ps1 -Entry dist/release-entry.json -Repo $repo -Tag $tag `
            -UpdateJson updates-branch/update.json -Prerelease:$info.isPrerelease `
            -Notes "$($info.body)" -Published $published

          git -C updates-branch add update.json
          git -C updates-branch commit -m "update.json for $tag"
          git -C updates-branch push origin HEAD:refs/heads/updates
